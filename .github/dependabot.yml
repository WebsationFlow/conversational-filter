version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Only open PRs for security patches, not every minor bump
    open-pull-requests-limit: 5
    # Group minor/patch updates into one PR to reduce noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Auto-label for the workflow to pick up
    labels:
      - "dependencies"
